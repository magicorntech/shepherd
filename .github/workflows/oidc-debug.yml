name: OIDC debug (temporary)

# Prints the claims GitHub puts in the OIDC token, to debug an AWS
# "Not authorized to perform sts:AssumeRoleWithWebIdentity". Run it by hand
# from the Actions tab. Only the non-secret claims are printed; the token
# itself never is. Delete this file once release works.
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: show OIDC claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for k in ("iss", "sub", "aud", "repository", "repository_owner", "ref", "event_name", "job_workflow_ref"):
              print(f"{k}: {claims.get(k)}")
          print("all claim names:", sorted(claims))
          PY
