# Ready-made values for Magicorn's charts-deployment chart (2.3.0+) that
# deploy shepherd:
#
#   helm upgrade --install shepherd oci://public.ecr.aws/magicorn/charts-deployment \
#     --version 2.3.0 -n shepherd --create-namespace \
#     -f https://raw.githubusercontent.com/magicorntech/shepherd/0.2.0/deploy/values.yaml
#
# Acts on the whole cluster out of the box: any pod stuck Terminating on a
# dead node (and not excluded: finalizers, StatefulSet, PVC) is force-deleted.
# To preview first, add --dry-run=true below. Per workload, the pod label
# shepherd.magicorn.co/force-delete overrides the default: off (exempt),
# dead-node, or any (also stuck-on-healthy-node).
global:
  destination: datacenter # no cloud-specific objects; shepherd has no ingress

  deployment:
    image:
      # Tag == shepherd release version (ci/check-versions.sh enforces it).
      uri: public.ecr.aws/magicorn/shepherd:0.2.0
      pullPolicy: IfNotPresent
      imagePullSecrets: []
      # All flags: https://github.com/magicorntech/shepherd#flags
      args:
        - --default-mode=dead-node # off | dead-node | any, for pods without the label
        # - --dry-run=true # log what would be deleted, delete nothing
        - --dead-node-buffer=30s
        - --healthy-node-buffer=5m
        - --max-deletes-per-sweep=50
        - --evicted-ttl-minutes=1440 # evicted-pods job: delete pods the kubelet evicted once they are this old (24h)
        - --breaker-not-ready-fraction=0.3
        - --breaker-min-nodes=5
        # - --include-statefulset
        # - --exclude-jobs=evicted-pods # turn a job off (stuck-pods, evicted-pods)
        # - --include-pvc
        # - --namespace=my-namespace # restrict to a single namespace
    env: []
    # Two replicas: one holds the Lease and sweeps, the other is a warm
    # standby. Leader election is on by default (--leader-elect).
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    readiness:
      httpGet: {path: /readyz, port: metrics}
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      httpGet: {path: /healthz, port: metrics}
      periodSeconds: 20
      failureThreshold: 3
    deregistrationTime: 30
    strategy:
      type: RollingUpdate
      rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
    # If shepherd's own node dies, the standby must take over in seconds,
    # not after Kubernetes' default 5 minutes of toleration.
    tolerations:
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway

  service:
    enabled: true
    type: ClusterIP
    ports:
      metrics:
        inner: 8080
        outer: 8080

  security:
    serviceAccount:
      enabled: true
      clusterWideAccess: true
      # Note: charts-deployment can only render a ClusterRole, so the Lease
      # permission leader election needs is cluster-wide here. It does not
      # let shepherd do anything it could not already do with pod delete
      # rights; if that bothers you, run one replica with --leader-elect=false.
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch, delete]
        - apiGroups: [""]
          resources: [nodes]
          verbs: [get, list, watch]
        - apiGroups: [""]
          resources: [events]
          verbs: [create, patch]
        - apiGroups: [coordination.k8s.io]
          resources: [leases]
          verbs: [get, create, update]
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}

  # Keep at least one replica (the leader or the standby) through node drains.
  pdb:
    enabled: true
    minAvailable: 1
