# Things charts-deployment has no concept of. Apply BEFORE the helm install
# (it also creates the namespace):
#
#   kubectl apply -f deploy/extras.yaml
#
# Assumes release name and namespace `shepherd` (as in values.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: shepherd
---
# Leader election: Lease access scoped to shepherd's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shepherd-leader-election
  namespace: shepherd
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shepherd-leader-election
  namespace: shepherd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shepherd-leader-election
subjects:
  - kind: ServiceAccount
    name: shepherd
    namespace: shepherd
---
# Keep at least one replica (the leader or the standby) through node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shepherd
  namespace: shepherd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shepherd
      app.kubernetes.io/instance: shepherd
